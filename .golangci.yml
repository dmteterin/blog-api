run:
  timeout: 5m
  tests: true
  skip-dirs:
    - internal/handler/mocks
    - internal/service/mocks
linters:
  enable:
    - govet
    - errcheck
    - staticcheck
    - gofmt
    - gosimple
    - unused
    - ineffassign
    - typecheck
    - goimports
    - misspell
    - gocyclo
    - prealloc

issues:
  exclude-use-default: false
